openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: LoanLedger API - Loan management with interest and commission tracking
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: borrowers
    description: Loan borrower management
  - name: payments
    description: Loan payment records
  - name: analytics
    description: Statistics and analytics
  - name: funds
    description: Fund transfer tracking

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── USERS ───────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user basic info (not password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Admin - list all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Admin - create new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Admin - get user details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    patch:
      operationId: updateUser
      tags: [users]
      summary: Admin - update user role or info
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAdminUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ─── BORROWERS ───────────────────────────────────────────────────────────────
  /borrowers:
    get:
      operationId: listBorrowers
      tags: [borrowers]
      summary: List borrowers (own for user, all for admin) with pagination
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, closed, defaulted]
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: month
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: Filter by loan start month (YYYY-MM)
      responses:
        "200":
          description: Paginated list of borrowers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BorrowerList"
    post:
      operationId: createBorrower
      tags: [borrowers]
      summary: Create a new loan borrower
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BorrowerInput"
      responses:
        "201":
          description: Created borrower
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Borrower"

  /borrowers/{id}:
    get:
      operationId: getBorrower
      tags: [borrowers]
      summary: Get borrower details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Borrower details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Borrower"
        "404":
          description: Not found
    patch:
      operationId: updateBorrower
      tags: [borrowers]
      summary: Update borrower basic info
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BorrowerUpdate"
      responses:
        "200":
          description: Updated borrower
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Borrower"
    delete:
      operationId: deleteBorrower
      tags: [borrowers]
      summary: Delete a borrower
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /borrowers/{id}/sub-accounts:
    get:
      operationId: listBorrowerSubAccounts
      tags: [borrowers]
      summary: List sub-accounts of a parent borrower
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sub-accounts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Borrower"
    post:
      operationId: createBorrowerSubAccount
      tags: [borrowers]
      summary: Create a sub-account (loan tranche) for a parent borrower
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubAccountInput"
      responses:
        "201":
          description: Created sub-account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Borrower"

  /borrowers/{id}/merge-sub-accounts:
    post:
      operationId: mergeBorrowerSubAccounts
      tags: [borrowers]
      summary: Merge all sub-accounts into the parent borrower
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated parent borrower after merge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Borrower"

  # ─── PAYMENTS ────────────────────────────────────────────────────────────────
  /borrowers/{borrowerId}/payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List monthly payment records for a borrower
      parameters:
        - name: borrowerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Record a monthly payment
      parameters:
        - name: borrowerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /borrowers/{borrowerId}/payments/{paymentId}:
    patch:
      operationId: updatePayment
      tags: [payments]
      summary: Update a payment record
      parameters:
        - name: borrowerId
          in: path
          required: true
          schema:
            type: integer
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentUpdate"
      responses:
        "200":
          description: Updated payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
    delete:
      operationId: deletePayment
      tags: [payments]
      summary: Delete a payment record
      parameters:
        - name: borrowerId
          in: path
          required: true
          schema:
            type: integer
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── ANALYTICS ───────────────────────────────────────────────────────────────
  /analytics/dashboard:
    get:
      operationId: getDashboardStats
      tags: [analytics]
      summary: Current user dashboard summary stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /analytics/monthly:
    get:
      operationId: getMonthlyStats
      tags: [analytics]
      summary: Monthly interest and commission breakdown
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Monthly stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyStats"

  /analytics/yearly:
    get:
      operationId: getYearlyStats
      tags: [analytics]
      summary: Yearly interest and commission breakdown
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Yearly stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/YearlyStats"

  /analytics/users:
    get:
      operationId: getUserStats
      tags: [analytics]
      summary: Admin - per-user interest and commission breakdown
      responses:
        "200":
          description: User stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserStats"

  /analytics/admin-dashboard:
    get:
      operationId: getAdminDashboard
      tags: [analytics]
      summary: Admin dashboard - overview of all loans, users, cashflow
      responses:
        "200":
          description: Admin dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

  /analytics/fund-analytics:
    get:
      operationId: getFundAnalytics
      tags: [analytics]
      summary: Admin - fund transfer analytics (capital deployed, idle, at-risk, monthly inflows)
      responses:
        "200":
          description: Fund analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundAnalytics"

  # ─── FUNDS ────────────────────────────────────────────────────────────────
  /funds:
    get:
      operationId: listFunds
      tags: [funds]
      summary: List fund transfers (admin sees all, user sees own)
      responses:
        "200":
          description: List of fund transfers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundList"
    post:
      operationId: createFund
      tags: [funds]
      summary: Admin - record a fund transfer to a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundInput"
      responses:
        "201":
          description: Created fund record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fund"

  /funds/{id}:
    patch:
      operationId: updateFund
      tags: [funds]
      summary: Admin - update a fund transfer record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundUpdate"
      responses:
        "200":
          description: Updated fund record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fund"
        "404":
          description: Not found
    delete:
      operationId: deleteFund
      tags: [funds]
      summary: Admin - delete a fund transfer record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/users/{id}/borrowers:
    get:
      operationId: getAdminUserBorrowers
      tags: [users]
      summary: Admin - list active borrowers for a specific lender user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Active borrowers for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUserBorrower"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /users/{id}/balance:
    get:
      operationId: getUserBalance
      tags: [users]
      summary: Get funded vs disbursed balance for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Balance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBalance"
        "403":
          description: Forbidden
        "404":
          description: Not found

  # ─── COLLECTIONS ──────────────────────────────────────────────────────────
  /collections/current-month:
    get:
      operationId: getCurrentMonthCollections
      tags: [analytics]
      summary: Payment collection status per borrower for a selected month
      parameters:
        - name: year
          in: query
          required: false
          description: Calendar year to view; defaults to the current year
          schema:
            type: integer
        - name: month
          in: query
          required: false
          description: Calendar month to view (1-12); defaults to the current month
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        "200":
          description: Collection items for the selected month
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollectionItem"

# ─── COMPONENTS ──────────────────────────────────────────────────────────────
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── User ──────────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, clerkId, email, name, role, createdAt]
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: string
        name:
          type: string
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, user]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [email, name, role]
      properties:
        email:
          type: string
        name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [admin, user]

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string

    UserAdminUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [admin, user]
        isActive:
          type: boolean

    # ── Borrower ───────────────────────────────────────────────────────────────
    Borrower:
      type: object
      required: [id, userId, name, address, principalAmount, interestRate, baseInterestRate, commissionRate, startDate, status, overdueCount, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: ["string", "null"]
        name:
          type: string
        address:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        principalAmount:
          type: number
          description: Loan principal amount in currency units
        interestRate:
          type: number
          description: Total monthly interest rate as percentage (e.g. 15 = 15%)
        baseInterestRate:
          type: number
          description: Base interest rate, fixed at 10%
        commissionRate:
          type: number
          description: Commission = interestRate - baseInterestRate (e.g. 5% if rate=15%)
        tenure:
          type: ["integer", "null"]
          description: Loan tenure in months (optional)
        startDate:
          type: string
          format: date
        endDate:
          type: ["string", "null"]
          format: date
        status:
          type: string
          enum: [active, closed, defaulted]
        notes:
          type: ["string", "null"]
        totalInterestEarned:
          type: ["number", "null"]
        totalCommissionEarned:
          type: ["number", "null"]
        monthsElapsed:
          type: ["integer", "null"]
        parentId:
          type: ["integer", "null"]
          description: Parent borrower ID for sub-accounts; null for top-level borrowers
        overdueCount:
          type: integer
          description: Number of unpaid payments for past months
        outstandingPrincipal:
          type: number
          description: Current outstanding principal after any principal reductions (defaults to principalAmount if no payments recorded)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BorrowerInput:
      type: object
      required: [name, address, principalAmount, interestRate, startDate]
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        principalAmount:
          type: number
        interestRate:
          type: number
          minimum: 0
          description: Total monthly interest % (default 10, can be higher)
        tenure:
          type: integer
          description: Tenure in months (optional)
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        notes:
          type: string

    SubAccountInput:
      type: object
      required: [principalAmount, interestRate, startDate]
      properties:
        principalAmount:
          type: number
        interestRate:
          type: number
          minimum: 0
          description: Total monthly interest % (default 10, can be higher)
        tenure:
          type: integer
          description: Tenure in months (optional)
        startDate:
          type: string
          format: date
        notes:
          type: string

    BorrowerUpdate:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        interestRate:
          type: number
          description: Total monthly interest % (recalculates commission automatically)
        tenure:
          type: integer
        endDate:
          type: string
          format: date
        status:
          type: string
          enum: [active, closed, defaulted]
        notes:
          type: string

    # ── Payment ────────────────────────────────────────────────────────────────
    Payment:
      type: object
      required: [id, borrowerId, month, year, principalAmount, interestRate, baseInterestRate, commissionRate, interestAmount, baseInterestAmount, commissionAmount, principalReduction, isPaid, isMissed, capitalizedAmount, createdAt]
      properties:
        id:
          type: integer
        borrowerId:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        year:
          type: integer
        principalAmount:
          type: number
          description: Outstanding principal at the time of this payment
        interestRate:
          type: number
        baseInterestRate:
          type: number
        commissionRate:
          type: number
        interestAmount:
          type: number
          description: Interest amount due (outstandingPrincipal * interestRate / 100)
        baseInterestAmount:
          type: number
          description: Base interest portion (outstandingPrincipal * 10 / 100)
        commissionAmount:
          type: number
          description: Commission portion (outstandingPrincipal * commissionRate / 100)
        amountPaid:
          type: ["number", "null"]
          description: Actual amount paid by borrower (may exceed interest, surplus reduces principal)
        principalReduction:
          type: number
          description: Amount applied to reduce outstanding principal (amountPaid - interestAmount when amountPaid > interestAmount)
          default: 0
        outstandingPrincipal:
          type: ["number", "null"]
          description: Remaining outstanding principal after this payment
        isPaid:
          type: boolean
        isMissed:
          type: boolean
          description: Whether this EMI was missed and capitalized into outstanding principal
        capitalizedAmount:
          type: number
          description: Full missed EMI added to principal (interest plus scheduled principal)
          default: 0
        paidDate:
          type: ["string", "null"]
          format: date
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    PaymentInput:
      type: object
      required: [month, year]
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
        year:
          type: integer
        amountPaid:
          type: number
          description: Actual amount paid. If > monthly interest, surplus reduces principal.
        isPaid:
          type: boolean
        isMissed:
          type: boolean
          description: Mark the month as missed; mutually exclusive with isPaid
        paidDate:
          type: string
          format: date
        notes:
          type: string

    PaymentUpdate:
      type: object
      properties:
        isPaid:
          type: boolean
        isMissed:
          type: boolean
          description: Mark the month as missed; mutually exclusive with isPaid
        paidDate:
          type: string
          format: date
        notes:
          type: string

    # ── Analytics ──────────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [totalBorrowers, activeBorrowers, totalPrincipal, totalInterestEarned, totalCommissionEarned, totalBaseInterestEarned, pendingPaymentsCount, currentMonthInterest, currentMonthCommission]
      properties:
        totalBorrowers:
          type: integer
        activeBorrowers:
          type: integer
        closedBorrowers:
          type: integer
        defaultedBorrowers:
          type: integer
        totalPrincipal:
          type: number
        totalInterestEarned:
          type: number
        totalCommissionEarned:
          type: number
        totalBaseInterestEarned:
          type: number
        pendingPaymentsCount:
          type: integer
        currentMonthInterest:
          type: number
        currentMonthCommission:
          type: number
        currentMonthBaseInterest:
          type: number

    MonthlyStats:
      type: object
      required: [month, year, totalInterest, baseInterest, commission, paymentsCount, paidCount]
      properties:
        month:
          type: integer
        year:
          type: integer
        totalInterest:
          type: number
        baseInterest:
          type: number
        commission:
          type: number
        paymentsCount:
          type: integer
        paidCount:
          type: integer
        principalOutstanding:
          type: ["number", "null"]

    YearlyStats:
      type: object
      required: [year, totalInterest, baseInterest, commission, paymentsCount, paidCount]
      properties:
        year:
          type: integer
        totalInterest:
          type: number
        baseInterest:
          type: number
        commission:
          type: number
        paymentsCount:
          type: integer
        paidCount:
          type: integer

    UserStats:
      type: object
      required: [userId, userName, totalBorrowers, totalPrincipal, totalInterest, totalBaseInterest, totalCommission]
      properties:
        userId:
          type: integer
        userName:
          type: string
        userEmail:
          type: string
        totalBorrowers:
          type: integer
        activeBorrowers:
          type: integer
        totalPrincipal:
          type: number
        totalInterest:
          type: number
        totalBaseInterest:
          type: number
        totalCommission:
          type: number

    AdminDashboard:
      type: object
      required: [totalUsers, activeUsers, totalBorrowers, activeBorrowers, totalPrincipalDeployed, totalInterestEarned, totalBaseInterestEarned, totalCommissionEarned, monthlyTrend, topPerformers]
      properties:
        totalUsers:
          type: integer
        activeUsers:
          type: integer
        totalBorrowers:
          type: integer
        activeBorrowers:
          type: integer
        totalPrincipalDeployed:
          type: number
        totalInterestEarned:
          type: number
        totalBaseInterestEarned:
          type: number
        totalCommissionEarned:
          type: number
        monthlyTrend:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyStats"
        topPerformers:
          type: array
          items:
            $ref: "#/components/schemas/UserStats"

    # ── Collections ────────────────────────────────────────────────────────────
    FundAnalytics:
      type: object
      required: [totalFunded, totalDisbursed, totalAvailable, atRisk, utilizationRate, monthlyInflows, paymentMethodBreakdown]
      properties:
        totalFunded:
          type: number
          description: Sum of all fund transfers ever recorded
        totalDisbursed:
          type: number
          description: Sum of principal for all active borrowers across all lenders
        totalAvailable:
          type: number
          description: totalFunded minus totalDisbursed
        atRisk:
          type: number
          description: Principal tied to borrowers that have at least one overdue payment
        utilizationRate:
          type: number
          description: Percentage of funded capital currently disbursed (0-100)
        monthlyInflows:
          type: array
          items:
            $ref: "#/components/schemas/FundMonthlyInflow"
        paymentMethodBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/FundPaymentMethodBreakdown"

    FundMonthlyInflow:
      type: object
      required: [year, month, label, amount, count]
      properties:
        year:
          type: integer
        month:
          type: integer
        label:
          type: string
          description: Human-readable label e.g. "Jan 2026"
        amount:
          type: number
        count:
          type: integer

    FundPaymentMethodBreakdown:
      type: object
      required: [method, label, amount, count]
      properties:
        method:
          type: string
        label:
          type: string
        amount:
          type: number
        count:
          type: integer

    CollectionItem:
      type: object
      required: [borrowerId, borrowerName, principalAmount, outstandingPrincipal, interestRate, interestDue, overdueCount, hasPaymentRecord, isPaid, isMissed, capitalizedAmount]
      properties:
        borrowerId:
          type: integer
        borrowerName:
          type: string
        phone:
          type: ["string", "null"]
        startDate:
          type: string
          description: Date the loan was issued (YYYY-MM-DD)
        principalAmount:
          type: number
        outstandingPrincipal:
          type: number
        interestRate:
          type: number
        interestDue:
          type: number
          description: Expected interest for current month based on outstanding principal
        overdueCount:
          type: integer
        hasPaymentRecord:
          type: boolean
        paymentId:
          type: ["integer", "null"]
        isPaid:
          type: boolean
        isMissed:
          type: boolean
        capitalizedAmount:
          type: number
          description: Full EMI added to principal when this month is marked missed
        amountPaid:
          type: ["number", "null"]

    # ── Fund ───────────────────────────────────────────────────────────────────
    Fund:
      type: object
      required: [id, adminId, userId, amount, paymentMethod, fundedAt, createdAt]
      properties:
        id:
          type: integer
        adminId:
          type: integer
        userId:
          type: integer
        userName:
          type: ["string", "null"]
        userEmail:
          type: ["string", "null"]
        amount:
          type: number
        paymentMethod:
          type: string
        notes:
          type: ["string", "null"]
        fundedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FundList:
      type: array
      items:
        $ref: "#/components/schemas/Fund"

    FundInput:
      type: object
      required: [userId, amount]
      properties:
        userId:
          type: integer
        amount:
          type: number
          minimum: 0.01
        paymentMethod:
          type: string
          default: online
        notes:
          type: string
        fundedAt:
          type: string
          format: date-time

    FundUpdate:
      type: object
      properties:
        amount:
          type: number
          minimum: 0.01
        paymentMethod:
          type: string
        notes:
          type: string
        fundedAt:
          type: string
          format: date-time

    UserBalance:
      type: object
      required: [userId, totalFunded, totalDisbursed, available]
      properties:
        userId:
          type: integer
        totalFunded:
          type: number
        totalDisbursed:
          type: number
        available:
          type: number

    # ── AdminUserBorrower ──────────────────────────────────────────────────────
    AdminUserBorrower:
      type: object
      required: [id, name, principalAmount, interestRate, status]
      properties:
        id:
          type: integer
        name:
          type: string
        principalAmount:
          type: number
        interestRate:
          type: number
        status:
          type: string
          enum: [active, closed, defaulted]

    # ── BorrowerList ───────────────────────────────────────────────────────────
    BorrowerList:
      type: object
      required: [data, total, page, limit, totalPages]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Borrower"
        total:
          type: integer
          description: Total matching borrowers
        page:
          type: integer
          description: Current page (1-indexed)
        limit:
          type: integer
          description: Items per page
        totalPages:
          type: integer
          description: Total number of pages
